compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: 'no'
fsdp_config:
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: false
  fsdp_reshard_after_forward: true
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_version: 2
machine_rank: 0
main_training_function: main
mixed_precision: bf16  # or fp16
num_machines: 1  # the number of nodes
num_processes: 2  # the number of GPUs in all nodes
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false

kt_config:
  enabled: true
  kt_backend: AMXINT8
  kt_num_threads: 96
  kt_tp_enabled: true
  kt_threadpool_count: 2
  kt_num_gpu_experts: 0
  kt_max_cache_depth: 2
  kt_use_lora_experts: false
  kt_lora_expert_num: 0
  kt_lora_expert_intermediate_size: 1024
  # lora_rank: auto (bridged from training YAML's lora_rank)
  # lora_alpha: auto (defaults to lora_rank * 2)
  # kt_weight_path: auto (bridged from training YAML's kt_weight_path)
  model_max_length: 15360
