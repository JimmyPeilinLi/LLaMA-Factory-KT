### model
model_name_or_path: /mnt/data/models/DeepSeek-V2-Lite-Chat
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: west_train
template: deepseek
cutoff_len: 20480
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: /mnt/data/hxx/kernel_new_test_adapter/Kllama_test_deepseekV2_WEST_ALL_CPU
logging_steps: 1
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: tensorboard  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 0.1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: false
ddp_timeout: 180000000
disable_gradient_checkpointing: true
resume_from_checkpoint: null


# kt_weight_path: /mnt/data3/models/DeepSeek-V2-Lite-INT8  # 预处理权重路径 (可选)

