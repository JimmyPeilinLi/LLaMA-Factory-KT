### model
model_name_or_path: /mnt/data/models/Qwen3-30B-A3B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 12
lora_target: 
  - up_proj
  - down_proj
  - gate_proj

### dataset
dataset: west_train
template: deepseek
cutoff_len: 20480
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: /mnt/data/hxx/kernel_new_test_adapter/Kllama_test_qwen3_30_WEST_MOEONLY
logging_steps: 1
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: tensorboard  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
disable_gradient_checkpointing: true
resume_from_checkpoint: null

### ktransformers (使用 KTMoEWrapper 统一接口)
use_kt: true                    # 启用 KTransformers MoE 后端
kt_backend: AMXINT8             # AMX 后端类型: AMXBF16, AMXINT8, AMXINT4
kt_num_threads: 64              # CPU 线程数
kt_tp_enabled: true            # 启用 NUMA 张量并行
kt_threadpool_count: 2        # NUMA 子池数量 (仅 kt_tp_enabled=true 时生效，默认=4)
kt_num_gpu_experts: 0           # GPU 上运行的专家数量 (0=全部在CPU)
# kt_moe_lora_device: gpu         # MoE LoRA 参数位置: gpu (推荐) 或 cpu (暂不支持)

# flash_attn: fa2                                                                                                                                    

kt_config:
  enabled: true
  kt_backend: AMXINT8
  kt_num_threads: 64
  kt_tp_enabled: true
  kt_threadpool_count: 2
  kt_num_gpu_experts: 0
  kt_use_lora_experts: false
  kt_lora_expert_num: 0
  kt_lora_expert_intermediate_size: 1024
  lora_rank: 12
  lora_alpha: 24
  model_max_length: 15360
  # kt_skip_expert_loading: true
  # kt_weight_path: /mnt/data/hxx/q3-235-i8
